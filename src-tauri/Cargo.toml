[package]
name = "vox"
version = "0.1.0"
description = "Vox — open-source, local-first voice agent for desktop"
authors = ["Vox contributors"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "vox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
cpal = "0.15"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "io-util"] }
futures-util = "0.3"
tokio-tungstenite = "0.24"
enigo = "0.6"

# Permission checks: AVFoundation mic TCC state + Accessibility prompt.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
core-foundation = "0.10"

# Metal inference only helps on Apple Silicon; Intel Macs run CPU whisper.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
whisper-rs = { version = "0.15", features = ["metal"] }

[target.'cfg(not(all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
whisper-rs = "0.15"

[profile.release]
strip = true
lto = true
